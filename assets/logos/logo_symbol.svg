<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C8CFF" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#7C8CFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="primaryRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9AA7FF"/>
      <stop offset="100%" stop-color="#6372E5"/>
    </linearGradient>
    <linearGradient id="innerCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="#0B0D10" stroke="#252B34" stroke-width="3"/>

  <!-- Ambient Aura Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#auraGlow)"/>

  <!-- Outer Track Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#28303E" stroke-width="7"/>

  <!-- Dynamic Focus Arc Segment -->
  <path d="M 256 106 A 150 150 0 0 1 406 256" fill="none" stroke="#7C8CFF" stroke-width="10" stroke-linecap="round"/>

  <!-- Main Luminous Focus Ring -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#primaryRingGrad)" stroke-width="14" stroke-linecap="round"/>

  <!-- Inner Aperture Well -->
  <circle cx="256" cy="256" r="68" fill="#1A1E24" stroke="#9AA7FF" stroke-width="6"/>

  <!-- Central Bindu (One-Pointed Attention) -->
  <circle cx="256" cy="256" r="28" fill="url(#innerCoreGrad)"/>

  <!-- Focal Spark -->
  <circle cx="256" cy="256" r="14" fill="#7C8CFF"/>
</svg>
